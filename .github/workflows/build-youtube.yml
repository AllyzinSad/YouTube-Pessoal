name: YouTube pessoal - verificar e compilar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-youtube.yml'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-e-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Obter fontes do projeto
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar sintaxe dos scripts
        run: |
          bash -n scripts/preparar-ferramentas.sh
          bash -n scripts/compilar.sh
          python3 -m py_compile scripts/validar-apk.py

      - name: Baixar CLI e verificar os cinco patches oficiais
        run: bash scripts/preparar-ferramentas.sh

      - name: Entregar ferramentas oficiais para compilacao com APK fornecido no chat
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: revanced-ferramentas-verified
          path: |
            tools/revanced-cli.jar
            tools/patches.rvp
          retention-days: 1
          if-no-files-found: error

      - name: Publicar lista de patches (diagnostico)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-patches
          path: output/patches-disponiveis.txt
          retention-days: 3

      - name: Conferir configuracao de compilacao
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          BUILD_PASSWORD: ${{ secrets.YOUTUBE_BUILD_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$REPO_PRIVATE" != "true" && -z "$BUILD_PASSWORD" ]]; then
            echo "::error::Em repositorio publico, crie o secret YOUTUBE_BUILD_PASSWORD para criptografar o APK e a assinatura antes do upload."
            exit 1
          fi

      - name: Obter APK-base
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          YOUTUBE_APK_URL: ${{ secrets.YOUTUBE_APK_URL }}
        run: |
          set -euo pipefail
          mkdir -p input output
          if [[ -n "$YOUTUBE_APK_URL" ]]; then
            curl --fail --location --retry 3 --silent --show-error \
              "$YOUTUBE_APK_URL" --output input/youtube.apk
          else
            if ! gh release download youtube-base --repo "$GITHUB_REPOSITORY" \
              --pattern youtube.apk --dir input --clobber; then
              echo "::error::Preciso do APK-base completo do YouTube: configure YOUTUBE_APK_URL ou anexe youtube.apk na release youtube-base."
              exit 1
            fi
          fi
          test -s input/youtube.apk
          unzip -tqq input/youtube.apk
          unzip -Z -1 input/youtube.apk | grep -Fx AndroidManifest.xml >/dev/null

      - name: Validar pacote, Android minimo e compatibilidade real dos patches
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/validar-apk.py input/youtube.apk --patches output/patches-disponiveis.txt

      - name: Recuperar a mesma assinatura para atualizacoes
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          YOUTUBE_KEYSTORE_B64: ${{ secrets.YOUTUBE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p output
          if [[ -n "$YOUTUBE_KEYSTORE_B64" ]]; then
            printf '%s' "$YOUTUBE_KEYSTORE_B64" | base64 --decode > output/youtube-personal.keystore
            test -s output/youtube-personal.keystore
          fi

      - name: Aplicar AdBlock, GmsCore, SponsorBlock e player
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/compilar.sh

      - name: Criptografar APK e assinatura em repositorio publico
        if: github.event_name == 'workflow_dispatch' && !github.event.repository.private
        shell: bash
        env:
          YOUTUBE_BUILD_PASSWORD: ${{ secrets.YOUTUBE_BUILD_PASSWORD }}
        run: |
          set -euo pipefail
          tar czf output/youtube-pessoal.tar.gz -C output \
            YouTube-Pessoal.apk SHA256.txt youtube-personal.keystore
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in output/youtube-pessoal.tar.gz \
            -out output/youtube-pessoal.tar.gz.enc \
            -pass env:YOUTUBE_BUILD_PASSWORD
          rm -f output/youtube-pessoal.tar.gz

      - name: Publicar APK e assinatura no repositorio privado
        if: github.event_name == 'workflow_dispatch' && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Pessoal-APK
          path: |
            output/YouTube-Pessoal.apk
            output/SHA256.txt
            output/youtube-personal.keystore
          retention-days: 1
          if-no-files-found: error

      - name: Publicar pacote criptografado no repositorio publico
        if: github.event_name == 'workflow_dispatch' && !github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Pessoal-CRIPTOGRAFADO
          path: output/youtube-pessoal.tar.gz.enc
          retention-days: 1
          if-no-files-found: error
