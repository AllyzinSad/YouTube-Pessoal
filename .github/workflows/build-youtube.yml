name: YouTube pessoal - compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    name: Criar APK secundario
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exigir repositorio privado (protege APK e chave)
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPO_PRIVATE" != "true" ]]; then
            echo "::error::Torne o repositorio PRIVADO em Settings > General > Danger Zone antes de executar."
            exit 1
          fi

      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Conferir APK-base privado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input tools output
          if ! gh release download youtube-base --repo "$GITHUB_REPOSITORY" --pattern youtube.apk --dir input --clobber; then
            echo "::error::Adicione um youtube.apk completo como asset do Release com tag youtube-base (repositorio privado)."
            exit 1
          fi
          test -s input/youtube.apk
          file input/youtube.apk

      - name: Baixar ReVanced CLI e patches oficiais
        shell: bash
        run: |
          set -euo pipefail
          gh release download --repo ReVanced/revanced-cli --pattern '*-all.jar' --dir tools --clobber
          curl --fail --location --retry 3 --silent --show-error \
            'https://api.revanced.app/v5/patches.rvp' --output tools/patches.rvp
          test "$(find tools -maxdepth 1 -name '*-all.jar' | wc -l)" -eq 1
          test "$(find tools -maxdepth 1 -name '*.rvp' | wc -l)" -eq 1

      - name: Restaurar assinatura pessoal, se configurada
        shell: bash
        env:
          YOUTUBE_KEYSTORE_B64: ${{ secrets.YOUTUBE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "$YOUTUBE_KEYSTORE_B64" ]]; then
            printf '%s' "$YOUTUBE_KEYSTORE_B64" | base64 --decode > output/youtube-personal.keystore
            test -s output/youtube-personal.keystore
          fi

      - name: Aplicar patches e assinar APK
        shell: bash
        run: bash scripts/compilar.sh

      - name: Conferir resultado
        shell: bash
        run: |
          set -euo pipefail
          test -s output/YouTube-Pessoal.apk
          test -s output/youtube-personal.keystore
          sha256sum output/YouTube-Pessoal.apk > output/SHA256.txt

      - name: Disponibilizar APK privado e chave (1 dia)
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Pessoal-APK-e-assinatura
          path: |
            output/YouTube-Pessoal.apk
            output/SHA256.txt
            output/youtube-personal.keystore
          if-no-files-found: error
          retention-days: 1
